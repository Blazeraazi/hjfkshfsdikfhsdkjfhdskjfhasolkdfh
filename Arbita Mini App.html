<style>
:root{color-scheme:dark;--bg:#07074a;--c1:#0f1fe6;--c2:#7a14e8;--ac:#19c8ff;--tx:#fff;--mu:#a9b0ff;--gl:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#app{max-width:520px;margin:0 auto;padding:10px 14px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .12s,opacity .2s}
button:active,.tap:active{transform:scale(.95)}
button:disabled{opacity:.4}
h5{margin:16px 0 8px;font-size:15px;font-weight:600}.ac{color:var(--ac)}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chip{background:var(--gl);border-radius:20px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
.card{background:var(--c1);border-radius:16px;padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.card.p{background:linear-gradient(135deg,#8a14f0,#6a1ad0)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:var(--gl);border-radius:12px;padding:11px 14px;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
.btn.pr{background:var(--ac);color:#04144a;font-weight:700;justify-content:center}
.mu{color:var(--mu);font-size:12px}
.badge{background:var(--c2);border-radius:8px;padding:2px 7px;font-size:10px;font-weight:700}
.cv{border-radius:10px;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;text-shadow:0 2px 6px #0008;transition:transform .2s,box-shadow .2s}
.gm{text-align:center;font-size:11px;position:relative;animation:in .3s ease}
.gm.on .cv{box-shadow:0 0 0 3px var(--ac);transform:scale(.94)}
.gm.on:after{content:"✓";position:absolute;top:4px;right:4px;background:var(--ac);color:#04144a;border-radius:50%;width:18px;height:18px;line-height:18px;font-weight:800;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sel{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px;margin-bottom:8px}
.sel .cv{width:44px;font-size:14px;flex:none}
input{width:100%;padding:12px 14px;border-radius:14px;border:0;background:var(--c1);color:#fff;font:inherit;outline:0;margin-bottom:8px}
input::placeholder{color:#c5c9ff}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:492px;display:flex;background:#0a0a8a;border-radius:28px;padding:5px;z-index:5}
nav button{flex:1;background:none;border-radius:22px;padding:7px 0;font-size:11px;color:var(--mu)}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{background:var(--gl);color:var(--ac)}
.hero{margin:-10px -14px 12px;padding:30px 14px;text-align:center;font-size:28px;font-weight:700;min-height:130px;display:flex;align-items:center;justify-content:center}
.th{display:flex;gap:6px;flex-wrap:wrap}.th button{padding:7px 11px;border-radius:14px;background:var(--gl);font-size:12px}.th button.on{background:var(--ac);color:#04144a}
.bg{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:10}.bg.on{display:flex}
.sh{background:#0b0b6a;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px;animation:up .25s}
@keyframes up{from{transform:translateY(40px)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);background:#000d;padding:9px 15px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.dot{width:8px;height:8px;border-radius:50%;background:#2ee08a;display:inline-block}.dot.x{background:#ff4d5a}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .45s ease,visibility .45s}
.splash.off{opacity:0;visibility:hidden;pointer-events:none}
.splash h1{margin:0;font-size:42px;letter-spacing:1px;background:linear-gradient(90deg,var(--ac),#9b5cff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:sp 1.2s ease both}
@keyframes sp{from{opacity:0;transform:scale(.9)}}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--gl);border-top-color:var(--ac);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style></head><body>

const probe=()=>new Promise(r=>setTimeout(()=>r(Math.random()>.3),400));
async function checkMirror(silent){
 const p=POOL[S.country],old=S.mir[S.country]||0;let i=old,ok=false;
 for(let k=0;k<p.length&&!ok;k++){ok=await probe(p[i]);if(!ok)i=(i+1)%p.length}
 S.mir[S.country]=i;save();
 if(ok&&i!==old)toast(p[old]+' → '+p[i]);else if(!silent)toast(ok?'✓ '+p[i]:'✕');
 mstat=ok;if(V==='home')render();
}
